<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAL Chess</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12202b; --panel:#1a2b38; --panel2:#223646; --line:#2f4658;
  --text:#e8eef3; --muted:#93a8b8;
  --sea:#d3e2da; --deep:#5a8580;
  --gold:#f2b83c; --danger:#e5645a; --ok:#59c38e;a
  --f-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-piece:'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols','DejaVu Sans','Arial Unicode MS',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(34px,5.5vw,58px);font-weight:800;letter-spacing:-.03em}
h2{font-size:26px;font-weight:700}
h3{font-size:18px;font-weight:700;margin-bottom:10px}
h4{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--muted)}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:inherit}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);font:800 20px var(--f-head);letter-spacing:-.02em;cursor:pointer;padding:4px 0}
.brand .mark{font-family:var(--f-piece);font-size:28px;color:var(--gold);line-height:1}
.userbox{display:flex;align-items:center;gap:12px;font-weight:600}
.userbox .rate{color:var(--gold);font-family:var(--f-head);font-weight:700}
.userbox .uname{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* controls */
.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--gold);color:#241a05;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){background:#f7c75b;border-color:#f7c75b}
.btn.danger{border-color:var(--danger);color:#ffb3ac}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}
input,select{font:500 15px var(--f-body);background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
input::placeholder{color:#5f7686}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px}
label input{margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--ink);color:var(--muted);border:0;padding:9px 14px;font:600 14px var(--f-body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.msg{min-height:22px;font-size:14px;margin-bottom:10px;color:var(--muted)}
.msg.bad{color:#ff9d95}

/* pieces (shared) */
.pc,.cp{font-family:var(--f-piece);line-height:1;user-select:none;-webkit-user-select:none}
.pc.w,.cp.w{color:#fbf8ef;-webkit-text-stroke:1.4px #1b2b36;paint-order:stroke fill;text-shadow:0 2px 3px rgba(0,0,0,.28)}
.pc.b,.cp.b{color:#141e26;-webkit-text-stroke:1.4px rgba(255,255,255,.55);paint-order:stroke fill;text-shadow:0 2px 3px rgba(0,0,0,.3)}
.pc{font-size:calc(var(--bs) / 8 * .8);position:relative;z-index:2}
.cp{font-size:19px;-webkit-text-stroke-width:.7px;margin-right:-4px}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sq.light{background:var(--sea)}
.sq.dark{background:var(--deep)}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;max-width:1080px;margin:0 auto;padding:56px 24px}
.auth-hero p{font-size:18px;color:var(--muted);max-width:46ch;margin:16px 0 28px}
.mini{--bs:min(78vw,360px);width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 6px var(--panel2)}
.mini .pc{font-size:calc(var(--bs) / 8 * .8)}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--muted);font:700 16px var(--f-head);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.auth-card .btn.primary{width:100%;padding:12px}
.or{text-align:center;color:var(--muted);margin:16px 0;font-size:14px}
.auth-card #guest{width:100%}

/* lobby */
.lobby{max-width:1080px;margin:0 auto;padding:32px 24px 64px}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:44px}
.block{padding:20px 0;border-top:1px solid var(--line)}
.block:first-of-type{border-top:0;padding-top:12px}
.block .row+.btn{margin-top:2px}
.glist,.leaders{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.glist li .who{flex:1;min-width:0}
.glist li .who b{font-weight:600}
.glist li .sub{color:var(--muted);font-size:13px;display:block}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--gold)}
.res-w{color:var(--ok)} .res-l{color:#ff9d95} .res-d{color:var(--muted)}
.me{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.me-rate{font:800 44px var(--f-head);color:var(--gold);letter-spacing:-.03em}
.me-name{font:700 20px var(--f-head)}
.leaders li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.leaders .rk{color:var(--muted);font-variant-numeric:tabular-nums}
.leaders .rt{font-family:var(--f-head);font-weight:700;color:var(--gold)}
.leaders .wl{color:var(--muted);font-size:13px;min-width:64px;text-align:right}
.leaders li.me-row .nm{color:var(--gold);font-weight:700}
.leaders .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-row input{max-width:150px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}

/* game */
#view-game{--bs:max(280px,min(calc(100vw - 32px),calc(100vh - 210px),680px))}
.game{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:20px 16px 48px}
.board-wrap{width:var(--bs)}
.board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;box-shadow:0 20px 56px rgba(0,0,0,.5),0 0 0 6px var(--panel2);touch-action:manipulation}
.board .sq.last::before{content:"";position:absolute;inset:0;background:rgba(242,184,60,.5)}
.board .sq.sel{box-shadow:inset 0 0 0 4px var(--gold)}
.board .sq.check{background-image:radial-gradient(circle,rgba(229,100,90,.95) 0,rgba(229,100,90,.55) 45%,rgba(229,100,90,0) 72%)}
.board .sq.target::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(18,32,43,.38);z-index:3;pointer-events:none}
.board .sq.target.cap::after{width:100%;height:100%;border-radius:0;background:none;box-shadow:inset 0 0 0 5px rgba(18,32,43,.42)}
.board .pc[draggable="true"]{cursor:grab}
.co{position:absolute;font:700 clamp(9px,1.6vw,12px) var(--f-body);font-style:normal;z-index:1;pointer-events:none}
.co.rk{top:3px;left:4px}
.co.fl{bottom:2px;right:4px}
.sq.light .co{color:var(--deep)} .sq.dark .co{color:var(--sea)}
.pbar{display:flex;align-items:center;gap:10px;height:44px;font-weight:600}
.pbar .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.pbar.turn .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(242,184,60,.25)}
.pbar .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .pname em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px}
.pbar .caps{display:flex;align-items:center;margin-left:auto;padding-right:4px}
.pbar .adv{color:var(--muted);font-size:13px;margin-left:8px;min-width:22px}
.side{width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
.status{font:700 21px/1.25 var(--f-head);min-height:54px;padding-top:6px}
.status.done{color:var(--gold)}
.invite{background:var(--panel);border:1px dashed var(--muted);border-radius:12px;padding:14px 16px}
.invite .big{font:800 34px var(--f-head);letter-spacing:.16em;color:var(--gold)}
.moves{list-style:none;margin:0;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:230px;overflow-y:auto;font-variant-numeric:tabular-nums}
.moves li{display:grid;grid-template-columns:34px 1fr 1fr;padding:3px 0;font-weight:500;align-items:center}
.moves .n{color:var(--muted)}
.moves:empty::before{content:"Moves will appear here.";color:var(--muted);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px}

.moves span[data-ply]{cursor:pointer;border-radius:5px;padding:2px 6px;margin-left:-6px}
.moves span[data-ply]:hover{background:var(--panel2)}
.moves span.cur{background:var(--gold);color:#241a05;font-weight:700}
.note{font-size:13px;line-height:1.4}

/* Move review */
.move-review{display:inline-flex;align-items:center;gap:4px;margin-left:7px;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:middle}
.review-emoji{font-size:13px;line-height:1}
.review-excellent{color:#59c38e}
.review-incredible{color:#62b5ff}
.review-good{color:#b7d98b}
.review-inaccuracy{color:#f2b83c}
.review-mistake{color:#e99a52}
.review-blunder{color:#e5645a}
.review-loading{color:var(--muted);font-size:10px;margin-left:6px}

/* time controls + clocks */
.seg.tc{display:inline-grid;grid-auto-flow:column}
.seg.tc button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;padding:8px 12px}
.seg.tc small{font-weight:500;font-size:11px;opacity:.75}
.pbar .clk{font:700 20px var(--f-head);font-variant-numeric:tabular-nums;min-width:82px;text-align:center;padding:4px 10px;border-radius:8px;background:var(--panel2);margin-left:10px;flex:none}
.pbar .clk.run{background:var(--gold);color:#241a05}
.pbar .clk.low{color:#ff9d95}
.pbar .clk.run.low{background:var(--danger);color:#fff}
#friend-in{flex:1;min-width:0;width:auto}
.sq-badge{position:absolute;top:2px;right:2px;z-index:4;display:flex;align-items:center;justify-content:center;width:calc(var(--bs) / 8 * .38);height:calc(var(--bs) / 8 * .38);border-radius:50%;background:var(--panel);box-shadow:0 0 0 2px var(--line),0 2px 6px rgba(0,0,0,.45);font-size:calc(var(--bs) / 8 * .24);line-height:1;pointer-events:none}
.moves{position:relative}
.friends{margin-bottom:28px}
.friends .glist:empty{display:none}

/* notification center */
.bell{position:relative}
.bell .badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#241a05;font:800 11px/18px var(--f-body);text-align:center}
.npanel{position:fixed;top:64px;right:16px;z-index:65;width:min(380px,calc(100vw - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.ntoggle{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.ntoggle input{width:auto;margin:0}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.nlist li:last-child{border-bottom:0}
.nlist .ntitle{font-weight:600}
.nlist .nsub{color:var(--muted);font-size:13px}
.nlist .nact{display:flex;gap:8px;flex-wrap:wrap}
.nempty{padding:24px 14px;text-align:center;color:var(--muted)}
.small{font-size:13px}

/* live alerts */
.hright{display:flex;align-items:center;gap:12px}
.alerts{position:fixed;top:66px;right:16px;z-index:70;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px))}
.alert{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:12px 40px 12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.45);animation:alert-in .25s ease-out}
.alert .atxt{display:flex;flex-direction:column;gap:2px}
.alert .atxt span{color:var(--muted);font-size:14px}
.alert .aact{display:flex;gap:8px;flex-wrap:wrap}
.alert .aact:empty{display:none}
.alert .aclose{position:absolute;top:6px;right:8px;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.alert .aclose:hover{color:var(--text);background:var(--line)}
@keyframes alert-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(6,12,18,.66);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(400px,100%)}
.modal h3{font-size:20px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.promo{display:flex;gap:10px;justify-content:center}
.promo .btn{padding:6px 10px}
.promo .pc{font-size:46px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--danger)}

@media (max-width:860px){
  .auth{grid-template-columns:1fr;gap:32px;padding:28px 18px}
  .lobby-grid{grid-template-columns:1fr;gap:28px}
  .top{padding:10px 14px}
  .move-review{font-size:10px}
}
@media (max-width:600px){
  .moves{height:260px}
  .moves li{grid-template-columns:30px 1fr 1fr;font-size:13px}
  .move-review{margin-left:4px}
  .seg.tc{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="brand" type="button" aria-label="PAL Chess home"><span class="mark">&#9822;&#xFE0E;</span><span>PAL Chess</span></button>
  <div class="hright">
    <button class="btn ghost sm bell hidden" id="btn-bell" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Notifications"><span aria-hidden="true">🔔</span><span class="badge hidden" id="bell-badge">0</span></button>
    <button class="btn ghost sm" id="btn-sound" type="button" aria-pressed="false"></button>
    <div class="userbox" id="userbox"></div>
  </div>
</header>

<main>
  <!-- Sign in -->
  <section id="view-auth" class="auth hidden">
    <div class="auth-hero">
      <h1>Play chess.<br>Keep your rating.</h1>
      <p>Sign in to challenge friends online, climb the leaderboard, and pick games back up on any device. Or skip the account and play the computer.</p>
      <div class="mini" id="mini" aria-hidden="true"></div>
    </div>
    <div class="auth-card">
      <div class="tabs" role="tablist">
        <button id="tab-in" type="button" class="on">Sign in</button>
        <button id="tab-up" type="button">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label>Username<input id="a-user" autocomplete="username" maxlength="20" placeholder="3–20 letters, numbers, underscores"></label>
        <label>Password<input id="a-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
        <div id="auth-msg" class="msg" role="status"></div>
        <button class="btn primary" id="auth-submit" type="submit">Sign in</button>
      </form>
      <div class="or">or</div>
      <button class="btn" id="guest" type="button">Play as guest</button>
    </div>
  </section>

  <!-- Lobby -->
  <section id="view-lobby" class="lobby hidden">
    <div class="lobby-grid">
      <div>
        <h2>Start a game</h2>
        <div class="block">
          <h3>Play the computer</h3>
          <div class="row">
            <div class="seg" id="seg-level" data-val="2" aria-label="Difficulty">
              <button type="button" data-v="1">Easy</button><button type="button" data-v="2" class="on">Medium</button><button type="button" data-v="3">Hard</button>
            </div>
            <div class="seg" id="seg-color" data-val="w" aria-label="Your color">
              <button type="button" data-v="w" class="on">White</button><button type="button" data-v="b">Black</button><button type="button" data-v="r">Random</button>
            </div>
          </div>
          <div class="row" id="tc-ai"></div>
          <button class="btn primary" id="start-ai" type="button">Start game</button>
        </div>
        <div class="block">
          <h3>Two players, one screen</h3>
          <div class="row" id="tc-local"></div>
          <button class="btn" id="start-local" type="button">Pass and play</button>
        </div>
        <div class="block" id="online-block"></div>
      </div>
      <div>
        <div id="me-card"></div>
        <div class="friends" id="friends-block"></div>
        <h2 style="margin-bottom:8px">Leaderboard</h2>
        <ol class="leaders" id="leaders"></ol>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="view-game" class="hidden">
    <div class="game">
      <div class="board-wrap">
        <div class="pbar" id="pbar-top"></div>
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="pbar" id="pbar-bot"></div>
      </div>
      <aside class="side">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="invite hidden" id="invite"></div>
        <ol class="moves" id="moves" aria-label="Move list"></ol>
        <div class="note muted hidden" id="note"></div>
        <div class="controls" id="controls"></div>
      </aside>
    </div>
  </section>
</main>

<div id="modal-root"></div>
<div class="npanel hidden" id="npanel" role="dialog" aria-label="Notifications"></div>
<div class="alerts" id="alerts" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function evaluate(g) { // score from White's point of view
  const b = g.board();
  let s = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p) continue;
      const idx = p.color === 'w' ? r * 8 + c : (7 - r) * 8 + c;
      const v = VAL[p.type] + PST[p.type][idx];
      s += p.color === 'w' ? v : -v;
    }
  }
  return s;
}

function moveScore(m) {
  return (m.captured ? VAL[m.captured] * 10 - VAL[m.piece] : 0) + (m.promotion ? 800 : 0);
}

function orderMoves(moves) {
  return moves.sort((a, b) => moveScore(b) - moveScore(a));
}

function negamax(g, depth, alpha, beta) {
  if (depth === 0) return (g.turn() === 'w' ? 1 : -1) * evaluate(g);
  const moves = g.moves({verbose: true});
  if (!moves.length) return g.in_check() ? -100000 - depth : 0;
  orderMoves(moves);
  let best = -Infinity;
  for (const m of moves) {
    g.move({from: m.from, to: m.to, promotion: m.promotion});
    const sc = -negamax(g, depth - 1, -beta, -alpha);
    g.undo();
    if (sc > best) best = sc;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function pickAIMove(g, level) {
  const moves = g.moves({verbose: true});
  if (!moves.length) return null;
  if (level === 1) {
    const caps = moves.filter(m => m.captured);
    return (caps.length && Math.random() < 0.5) ? pick(caps) : pick(moves);
  }
  if (g.history().length < 2) {
    const book = ['e4','d4','c4','Nf3','e5','c5','e6','c6','d5','Nf6'];
    const opts = moves.filter(m => book.includes(m.san));
    if (opts.length) return pick(opts);
  }
  const depth = level === 2 ? 2 : 3;
  moves.sort(() => Math.random() - 0.5);
  orderMoves(moves);
  let best = moves[0], alpha = -Infinity;
  for (const m of moves) {
    g.move({from: m.from, to: m.to, promotion: m.promotion});
    const sc = -negamax(g, depth - 1, -Infinity, -alpha);
    g.undo();
    if (sc > alpha) { alpha = sc; best = m; }
  }
  return best;
}

// A bot with a target rating. Weaker bots search shallower and pick among decent moves more loosely
// (softmax over the search scores); stronger bots almost always play their best line.
// The rating is a rough guide, not a measured strength.
function pickBotMove(g, elo) {
  const moves = g.moves({verbose: true});
  if (!moves.length) return null;
  if (elo >= 900 && g.history().length < 2) {
    const book = ['e4','d4','c4','Nf3','e5','c5','e6','c6','d5','Nf6'];
    const opts = moves.filter(m => book.includes(m.san));
    if (opts.length) return pick(opts);
  }
  const depth = elo < 1000 ? 1 : elo < 1400 ? 2 : 3;
  const T = Math.max(5, Math.min(260, (1750 - elo) * 0.35));   // centipawns of "looseness"
  const scored = moves.map(m => {
    g.move({from: m.from, to: m.to, promotion: m.promotion});
    const sc = -negamax(g, depth - 1, -Infinity, Infinity);
    g.undo();
    return {m, sc};
  });
  const best = Math.max(...scored.map(x => x.sc));
  const w = scored.map(x => Math.exp(Math.max(-50, (x.sc - best) / T)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return scored[i].m; }
  return scored[0].m;
}
// </ai>

function gameEnd(g) {
  if (g.in_checkmate()) return {result: g.turn() === 'w' ? '0-1' : '1-0', reason: 'checkmate'};
  if (g.in_stalemate()) return {result: '1/2-1/2', reason: 'stalemate'};
  if (g.insufficient_material()) return {result: '1/2-1/2', reason: 'insufficient material'};
  if (g.in_threefold_repetition()) return {result: '1/2-1/2', reason: 'repetition'};
  if (g.in_draw()) return {result: '1/2-1/2', reason: 'the fifty-move rule'};
  return null;
}

function rebuild(moves) {
  const g = new Chess();
  for (const san of (moves || [])) { if (!g.move(san)) break; }
  return g;
}

const NOT_SET_UP = 'The database is not set up yet. Run setup.sql in the Supabase SQL editor.';

// Accounts are username + password, stored in the database (bcrypt). Each browser keeps an anonymous
// Supabase session; logging in links that session to your account. No email is involved.
function dbMsg(error) {
  const m = (error && error.message) || 'Something went wrong.';
  if (/could not find the function|schema cache|does not exist/i.test(m)) return NOT_SET_UP;
  if (/anonymous/i.test(m) && /disabled|not enabled/i.test(m)) return ANON_OFF_HELP;
  return m;
}

async function ensureSession() {
  const {data} = await sb.auth.getSession();
  if (data && data.session) return data.session;
  const r = await sb.auth.signInAnonymously();
  if (r.error) throw new Error(dbMsg(r.error));
  return r.data.session;
}

// Which account (if any) is this browser session signed in to?
async function syncAccount() {
  const {data} = await sb.rpc('me');
  await handleUser(data ? {id: data} : null);
}

async function submitAuth(e) {
  e.preventDefault();
  const uname = $('a-user').value.trim(), pass = $('a-pass').value;
  if (!uname || !pass) return authMsg('Enter your username and password.', true);
  const btn = $('auth-submit');
  btn.disabled = true; authMsg('');
  try {
    if (!/^[A-Za-z0-9_]{3,20}$/.test(uname)) throw new Error('Usernames are 3–20 letters, numbers or underscores.');
    if (authMode === 'up' && pass.length < 6) throw new Error('Use a password with at least 6 characters.');
    await ensureSession();
    if (authMode === 'in') {
      const {data, error} = await sb.rpc('login', {uname, pw: pass});
      if (error) throw new Error(dbMsg(error));
      if (!data) throw new Error('Wrong username or password.');
    } else {
      const {error} = await sb.rpc('register', {uname, pw: pass});
      if (error) throw new Error(dbMsg(error));
    }
    await syncAccount();
  } catch (err) {
    authMsg(err.message || 'Something went wrong.', true);
  } finally {
    btn.disabled = false;
  }
}

async function loadLobbyData() {
  const top = await sb.from('profiles').select('id,username,rating,wins,losses,draws').order('rating', {ascending: false}).order('wins', {ascending: false}).limit(10);
  if (!$('view-lobby').classList.contains('hidden')) renderLeaders(top.data || []);
  if (!S.user || !$('open-games')) return;
  const uid = S.user.id, mineFilter = `white_id.eq.${uid},black_id.eq.${uid}`;
  const [open, mine, chal, fr] = await Promise.all([
    sb.from('games').select('*').eq('status', 'waiting').is('invited_id', null).neq('creator_id', uid).order('created_at', {ascending: false}).limit(15),
    sb.from('games').select('*').or(mineFilter).in('status', ['waiting', 'active']).order('updated_at', {ascending: false}).limit(15),
    sb.from('games').select('*').eq('status', 'waiting').eq('invited_id', uid).order('created_at', {ascending: false}),
    sb.from('friendships').select('*').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`)
  ]);
  const msg = $('online-msg');
  if (!msg) return;
  if (open.error || fr.error) { msg.textContent = 'Online play needs the database set up. Run setup.sql in the Supabase SQL editor.'; return; }
  msg.textContent = '';
  const frs = fr.data || [];
  const games = [].concat(open.data || [], mine.data || [], chal.data || []);
  await fetchProfiles(games.flatMap(g => [g.white_id, g.black_id, g.creator_id, g.invited_id]).concat(frs.flatMap(r => [r.requester_id, r.addressee_id])));

  renderFriends(frs);

function renderFriends(rows) {
  const uid = S.user.id;
  const other = r => r.requester_id === uid ? r.addressee_id : r.requester_id;
  const byName = (a, b) => nameOf(other(a)).toLowerCase().localeCompare(nameOf(other(b)).toLowerCase());
  const incoming = rows.filter(r => r.status === 'pending' && r.addressee_id === uid);
  const outgoing = rows.filter(r => r.status === 'pending' && r.requester_id === uid);
  const friends = rows.filter(r => r.status === 'accepted').sort(byName);
  $('friend-reqs').innerHTML =
    incoming.map(r => `<li><span class="who"><b>${esc(nameOf(r.requester_id))}</b><span class="sub">wants to be friends</span></span><button class="btn sm primary" data-act="f-accept" data-id="${r.id}" type="button">Accept</button><button class="btn sm ghost" data-act="f-remove" data-id="${r.id}" type="button">Decline</button></li>`).join('') +

async function createGame(pref, tc, invitedId) {
  const c = pref === 'r' ? (Math.random() < 0.5 ? 'w' : 'b') : pref;
  const row = {creator_id: S.user.id, time_control: tc || 0};
  row[c === 'w' ? 'white_id' : 'black_id'] = S.user.id;
  if (invitedId) row.invited_id = invitedId;
  const {data, error} = await sb.from('games').insert(row).select().single();
  if (error) return toast(error.message, true);
  if (invitedId) toast('Challenge sent. They will see it in their lobby.');
  openOnline(data);
}

async function joinGame(id) {
  const {data, error} = await sb.rpc('join_game', {gid: id});
  const row = Array.isArray(data) ? data[0] : data;
  if (error || !row) return toast(error ? error.message : 'Could not join that game.', true);
  openOnline(row);
}

async function joinByCode() {
  const code = $('code-in').value.trim().toUpperCase();
  if (code.length < 4) return toast('Enter the 6-character game code.', true);
  const {data, error} = await sb.from('games').select('id,status,white_id,black_id').eq('code', code).maybeSingle();
  if (error) return toast(error.message, true);
  if (!data) return toast('No game found with that code.', true);
  if (data.status === 'waiting') return joinGame(data.id);
  if (data.white_id === S.user.id || data.black_id === S.user.id) return resume(data.id);
  toast('That game has already started.', true);
}

async function resume(id) {
  const {data, error} = await sb.from('games').select('*').eq('id', id).maybeSingle();
  if (error || !data) return toast('Could not open that game.', true);
  if (data.white_id !== S.user.id && data.black_id !== S.user.id) return toast('You are not a player in that game.', true);
  openOnline(data);
}

async function cancelGame(id) {
  const {error} = await sb.from('games').delete().eq('id', id);
  if (error) toast(error.message, true);
  loadLobbyData();
}

/* ═════════════ Online games ═════════════ */
function teardownOnline() {
  endReview();
  S.sfxPly = -1; S.endPlayed = null; S.lowSec = 0;   // next game starts silent until something happens
  if (S.online) {
    if (S.online.channel) sb.removeChannel(S.online.channel);
    clearInterval(S.online.poll);
  }
  S.online = null;
}

async function openOnline(row) {
  teardownOnline(); clearSel();
  S.mode = 'online';
  S.color = row.white_id === S.user.id ? 'w' : 'b';
  S.flip = S.color === 'b';
  S.online = {row, busy: false, settled: false, channel: null, poll: null};
  await Promise.all([fetchProfiles([row.white_id, row.black_id, row.invited_id]), syncServerClock()]);
  S.game = rebuild(row.moves); syncLast();
  S.over = row.status === 'finished' ? {result: row.result, reason: row.reason} : null;
  S.endPlayed = S.over;
  showView('game'); render();
  const id = row.id;
  S.online.channel = sb.channel('game-' + id)
    .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'games', filter: 'id=eq.' + id}, p => applyRow(p.new))
    .subscribe();
  S.online.poll = setInterval(pollOnline, 3000); // fallback if realtime is unavailable
  if (S.over) settle();
}

async function pollOnline() {
  if (!S.online || S.online.busy) return;
  const {data} = await sb.from('games').select('*').eq('id', S.online.row.id).maybeSingle();
  if (data) applyRow(data);
}

async function applyRow(row) {
  if (!S.online || S.online.row.id !== row.id) return;
  const cur = S.online.row;
  if (row.moves.length < cur.moves.length) return;
  const same = row.moves.length === cur.moves.length && row.status === cur.status && row.draw_offer === cur.draw_offer && row.black_id === cur.black_id && row.white_id === cur.white_id;
  if (same) return;
  await fetchProfiles([row.white_id, row.black_id]);
  if (!S.online || S.online.row.id !== row.id) return;
  S.online.row = row;
  if (row.moves.length !== cur.moves.length) {
    S.game = rebuild(row.moves); syncLast(); clearSel();
  }
  if (row.status === 'finished' && !S.over) {
    S.over = {result: row.result, reason: row.reason};
    settle();
  }
  render();
  if (row.status === 'active' && row.draw_offer && row.draw_offer !== S.color && cur.draw_offer !== row.draw_offer) {
    modal('Draw offer', `<p>${esc(nameOf(S.color === 'w' ? row.black_id : row.white_id))} offers a draw.</p>`, [
      {label: 'Accept', cls: 'primary', onClick: acceptDraw},
      {label: 'Decline', onClick: () => { pushPatch({draw_offer: null}, {status: 'active'}).then(render); }}
    ]);
  }
}

async function pushPatch(patch, guard) {
  const row = S.online.row;
  S.online.busy = true;
  let q = sb.from('games').update(patch).eq('id', row.id);
  Object.keys(guard || {}).forEach(k => { q = q.eq(k, guard[k]); });
  const {data, error} = await q.select().single();
  S.online.busy = false;
  if (error) { toast(error.message, true); return null; }
  S.online.row = data;
  return data;
}

async function sendMove(end) {
  const patch = {moves: S.game.history(), draw_offer: null};
  if (end) { patch.status = 'finished'; patch.result = end.result; patch.reason = end.reason; }
  const data = await pushPatch(patch, {turn: S.color, status: 'active'});
  if (!data) return resync();
  render();
  if (end) settle();
}

async function resync() {
  if (!S.online) return;
  const {data} = await sb.from('games').select('*').eq('id', S.online.row.id).maybeSingle();
  if (!data) return;
  S.online.row = data;
  S.game = rebuild(data.moves); syncLast(); clearSel();
  S.over = data.status === 'finished' ? {result: data.result, reason: data.reason} : null;
  render();
}

async function settle() {
  if (!S.online || S.online.settled) return;
  S.online.settled = true;
  clearInterval(S.online.poll);
  const row = S.online.row, before = S.profile ? S.profile.rating : null;
  // Records the rating change, and deletes the game row once both players have acknowledged it
  const ack = await sb.rpc('acknowledge_game', {gid: row.id});
  if (ack.error) await sb.rpc('record_result', {gid: row.id});
  await loadProfile();
  await fetchProfiles([row.white_id, row.black_id], true);
  renderUserBox(); render();
  if (before != null && S.profile && S.profile.rating !== before) {
    const d = S.profile.rating - before;
    toast(`Rating ${before} to ${S.profile.rating} (${d > 0 ? '+' : ''}${d})`);
  }
}

function offerDraw() {
  pushPatch({draw_offer: S.color}, {status: 'active'}).then(d => { if (d) toast('Draw offered.'); render(); });
}
async function acceptDraw() {
  const d = await pushPatch({status: 'finished', result: '1/2-1/2', reason: 'agreement', draw_offer: null}, {status: 'active'});
  if (d) { S.over = {result: '1/2-1/2', reason: 'agreement'}; render(); settle(); }
}
function confirmResign() {
  modal('Resign this game?', '<p>Your opponent wins and your rating drops.</p>', [
    {label: 'Resign', cls: 'danger', onClick: async () => {
      const res = S.color === 'w' ? '0-1' : '1-0';
      const d = await pushPatch({status: 'finished', result: res, reason: 'resignation', draw_offer: null}, {status: 'active'});
      if (d) { S.over = {result: res, reason: 'resignation'}; render(); settle(); }
    }},
    {label: 'Keep playing'}
  ]);
}

function leaveGame() {
  teardownOnline();
  S.mode = null; S.game = null; S.over = null; S.aiThinking = false; clearSel();
  if (S.user || S.guest) goLobby(); else showView('auth');
}

function audio() {
  if (!SFX.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    SFX.ctx = new AC();
  }
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
  return SFX.ctx;
}
function tone(c, o) {
  const t0 = c.currentTime + (o.t || 0), d = o.d || 0.12, osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.v || 0.2, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0 + d + 0.03);
}
function noise(c, o) {
  const t0 = c.currentTime + (o.t || 0), len = Math.max(1, Math.floor(c.sampleRate * (o.d || 0.05)));
  const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(), filt = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; filt.type = o.type || 'bandpass'; filt.frequency.value = o.f || 1500; filt.Q.value = o.q || 0.8;
  g.gain.setValueAtTime(o.v || 0.3, t0);
  src.connect(filt); filt.connect(g); g.connect(c.destination);
  src.start(t0);
}

  draw:    c => { tone(c, {f: 523, d: 0.3, type: 'triangle', v: 0.2}); tone(c, {t: 0.14, f: 392, d: 0.36, type: 'triangle', v: 0.2}); },
  notify:  c => { tone(c, {f: 988, d: 0.32, v: 0.26}); tone(c, {t: 0.13, f: 1319, d: 0.5, v: 0.26}); },
  tick:    c => tone(c, {f: 1200, d: 0.04, type: 'square', v: 0.07})
};
function sfx(name) {
  if (!SFX.on) return;
  const c = audio();
  if (c && SOUNDS[name]) { try { SOUNDS[name](c); } catch (e) { /* audio is optional */ } }
}
function renderSoundBtn() {
  const b = $('btn-sound'), label = SFX.on ? 'Sound on' : 'Sound off';
  b.textContent = SFX.on ? '🔊' : '🔇';
  b.title = label; b.setAttribute('aria-label', label); b.setAttribute('aria-pressed', String(!SFX.on));
}
function setSound(on) {
  SFX.on = on;
  try { localStorage.setItem('palchess.sound', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  renderSoundBtn();
  if (on) sfx('move');
}

function sfxMove(g) {
  const m = g.history({verbose: true}).pop();
  if (!m) return;
  if (g.in_check()) sfx('check');
  else if (m.captured) sfx('capture');
  else if (m.flags.indexOf('k') >= 0 || m.flags.indexOf('q') >= 0) sfx('castle');
  else if (m.promotion) sfx('promote');
  else sfx('move');
}
function sfxEnd() {
  const o = S.over;
  if (!o) return;
  if (o.result === '1/2-1/2') return sfx('draw');
  if (S.mode === 'local') return sfx('win');
  sfx((o.result === '1-0') === (S.color === 'w') ? 'win' : 'lose');
}
// Called after every render: plays a sound when a new move (yours, the computer's or your
// opponent's) or a game result appears. A freshly opened game stays silent until something happens.
function syncSfx() {
  if (!S.game || S.review) return;
  const n = S.game.history().length;
  const grew = S.sfxPly >= 0 && n > S.sfxPly;
  S.sfxPly = n;
  if (grew) sfxMove(S.game);
  if (S.over && S.endPlayed !== S.over) {
    S.endPlayed = S.over;
    setTimeout(sfxEnd, grew ? 280 : 0);
  }
}

const TITLE = document.title;
function notify(o) {
  const box = $('alerts'), el = document.createElement('div');

  el.innerHTML = `<div class="atxt"><b>${esc(o.title)}</b><span>${esc(o.body || '')}</span></div><div class="aact"></div><button class="aclose" type="button" aria-label="Dismiss">×</button>`;
  const close = () => el.remove();
  (o.actions || []).forEach(a => {
    const b = document.createElement('button');

  });
  el.querySelector('.aclose').onclick = close;
  box.prepend(el);

  }

// Keep these three numbers in sync with find_match() in setup.sql.
const MM_BASE = 100, MM_STEP = 10, MM_MAX = 500;
const mmRange = sec => Math.min(MM_MAX, MM_BASE + MM_STEP * sec);

function startMatchmaking(tc) {

  ]);

    el.innerHTML = `${esc(tcLabel(tc))}<br>Looking for players rated ${Math.max(0, r - w)} to ${r + w}. Searching for ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}.`;

  };

  mm.poll = setInterval(mmPoll, 3000);

}
function stopMatchmaking() {

async function mmPoll() {
  const mm = S.mm;
  if (!mm || mm.busy) return;
  mm.busy = true;
  mm.inflight = Promise.resolve(sb.rpc('find_match', {tc: mm.tc}));

  if (S.mm !== mm) return;

}
async function cancelMatchmaking() {
  const mm = S.mm;
  if (!mm) return;
  stopMatchmaking();
  if (mm.inflight) await mm.inflight;
  if (mm.matched) return;                      // the poll that was in flight found a game; it opens it
  const {data} = await sb.rpc('cancel_match');

  else toast('Search cancelled.');

/* ═════════════ Clocks ═════════════ */
let SERVER_OFFSET = 0;   // server time minus this device's time, so online clocks agree
async function syncServerClock() {
  try {
    const t0 = Date.now();
    const {data, error} = await sb.rpc('server_time');
    const t1 = Date.now();
    if (!error && data) SERVER_OFFSET = tsMs(data) - (t0 + t1) / 2;
  } catch (e) { /* keep the old offset */ }
}
const serverNow = () => Date.now() + SERVER_OFFSET;
const tsMs = ts => Date.parse(String(ts).replace(/(\.\d{3})\d+/, '$1'));

function timedGame() {
  return S.mode === 'online' ? !!(S.online && S.online.row.time_control > 0) : S.tc > 0;
}
function initClock() { S.clock = {w: S.tc * 1000, b: S.tc * 1000, running: null, since: 0}; }

// Computer / pass-and-play: the first White move is free, then the clocks alternate.
function clockAfterMove(mover) {
  if (!S.tc || !S.clock) return;
  const c = S.clock, now = Date.now();
  if (c.running === mover) c[mover] -= now - c.since;
  c.running = S.over ? null : (mover === 'w' ? 'b' : 'w');
  c.since = now;
}

function isRunning(color) {
  if (!S.game || S.over || !timedGame()) return false;
  if (S.mode === 'online') {
    const r = S.online.row;
    return r.status === 'active' && r.moves.length >= 1 && r.turn === color;
  }
  return !!S.clock && S.clock.running === color;
}

function clockMs(color) {
  let ms;
  if (S.mode === 'online') {
    const r = S.online.row;
    ms = color === 'w' ? r.white_ms : r.black_ms;
    if (isRunning(color)) ms -= serverNow() - tsMs(r.turn_started_at);
  } else {
    ms = S.clock[color];
    if (isRunning(color)) ms -= Date.now() - S.clock.since;
  }
  return Math.max(0, ms);
}

function fmtClock(ms) {
  if (ms < 10000) return '0:' + (ms / 1000).toFixed(1).padStart(4, '0');
  const t = Math.ceil(ms / 1000);
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

function tick() {
  if (!S.game || S.review || !timedGame()) return;
  document.querySelectorAll('.clk').forEach(el => {
    const c = el.dataset.c, ms = clockMs(c);
    el.textContent = fmtClock(ms);
    el.classList.toggle('low', ms < 10000);
    el.classList.toggle('run', isRunning(c));
  });
  // your own clock ticking down in the last 10 seconds
  if ((S.mode === 'ai' || S.mode === 'online') && !S.over && isRunning(S.color) && clockMs(S.color) < 10000) {
    const sec = Math.ceil(clockMs(S.color) / 1000);
    if (sec !== S.lowSec) { S.lowSec = sec; sfx('tick'); }
  } else S.lowSec = 0;
  if (S.over) return;
  const runner = ['w', 'b'].find(isRunning);
  if (!runner || clockMs(runner) > 0) return;
  if (S.mode === 'online') { claimTimeout(); return; }
  S.clock[runner] = 0; S.clock.running = null;
  S.over = {result: runner === 'w' ? '0-1' : '1-0', reason: 'timeout'};
  S.aiThinking = false; clearSel(); render();
}

let claimBusy = false;
async function claimTimeout() {
  if (!S.online || claimBusy) return;
  claimBusy = true;
  const {data} = await sb.rpc('claim_timeout', {gid: S.online.row.id});
  const row = Array.isArray(data) ? data[0] : data;
  if (row) await applyRow(row);
  setTimeout(() => { claimBusy = false; }, 1200);   // the server decides; retry until it agrees
}

/* ═════════════ Playing ═════════════ */
function syncLast() {
  const h = S.game.history({verbose: true});
  S.last = h.length ? {from: h[h.length - 1].from, to: h[h.length - 1].to} : null;
}

function canInteract() {
  if (!S.game || S.over || S.review) return false;
  if (S.mode === 'ai') return !S.aiThinking && S.game.turn() === S.color;
  if (S.mode === 'online') return !!S.online && !S.online.busy && S.online.row.status === 'active' && S.game.turn() === S.color;
  return S.mode === 'local';
}

function ownsPiece(p) { return p.color === S.game.turn() && (S.mode === 'local' || p.color === S.color); }

function onSquare(sq) {
  if (!canInteract()) return;
  if (S.sel && S.targets.includes(sq)) return tryMove(S.sel, sq);
  const p = S.game.get(sq);
  if (p && ownsPiece(p)) {
    if (S.sel === sq) clearSel();
    else { S.sel = sq; S.targets = S.game.moves({square: sq, verbose: true}).map(m => m.to); }
  } else clearSel();
  paintTargets();
}

function tryMove(from, to) {
  const mv = S.game.moves({square: from, verbose: true}).filter(m => m.to === to);
  if (!mv.length) return;
  if (mv[0].promotion) {
    const color = mv[0].color;
    const root = modal('Promote pawn to', `<div class="promo">${['q', 'r', 'b', 'n'].map(t => `<button type="button" class="btn" data-t="${t}" aria-label="${t}"><span class="pc ${color}">${GLYPH[t]}</span></button>`).join('')}</div>`, [], true);
    root.querySelectorAll('button[data-t]').forEach(b => { b.onclick = () => { closeModal(); commit(from, to, b.dataset.t); }; });
    return;
  }
  commit(from, to);
}

function commit(from, to, promo) {
  const m = S.game.move({from, to, promotion: promo || 'q'});
  if (!m) return;
  S.last = {from, to}; clearSel();
  const end = gameEnd(S.game);
  if (end) S.over = end;
  if (S.mode !== 'online') clockAfterMove(m.color);
  render();
  if (S.mode === 'online') sendMove(end);
  else if (S.mode === 'ai' && !end) aiMove();
}

function aiMove() {
  const g = S.game;
  S.aiThinking = true; render();
  setTimeout(() => {
    if (S.game !== g || S.mode !== 'ai') return;
    if (S.over) { S.aiThinking = false; render(); return; }
    const m = S.botElo ? pickBotMove(g, S.botElo) : pickAIMove(g, S.aiLevel);
    S.aiThinking = false;
    if (m) {
      const mv = g.move({from: m.from, to: m.to, promotion: m.promotion || 'q'});
      S.last = {from: m.from, to: m.to};
      const end = gameEnd(g);
      if (end) S.over = end;
      clockAfterMove(mv.color);
    }
    render();
  }, 250);
}

function undo() {
  if (S.tc || S.aiThinking || !S.game.history().length) return;
  S.game.undo();
  if (S.mode === 'ai' && S.game.turn() !== S.color && S.game.history().length) S.game.undo();
  S.over = null; syncLast(); clearSel(); render();
  if (S.mode === 'ai' && S.game.turn() !== S.color) aiMove();
}

function newGame() {
  if (S.mode === 'ai') startAI(S.aiLevel, S.colorPref, S.tc, S.botElo);
  else startLocal(S.tc);
}

/* ═════════════ Rendering ═════════════ */
function viewGame() {
  if (!S.game) return null;
  return S.review ? rebuild(S.game.history().slice(0, S.review.ply)) : S.game;
}
function lastOf(g) {
  const h = g.history({verbose: true});
  return h.length ? {from: h[h.length - 1].from, to: h[h.length - 1].to} : null;
}
function render() { const vg = viewGame(); renderBoard(vg); renderSide(vg); syncSfx(); }

function findKing(brd, color) {
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = brd[r][c];
    if (p && p.type === 'k' && p.color === color) return FILES[c] + (8 - r);
  }
  return null;
}

function renderBoard(g) {
  const b = $('board');
  if (!g) { b.innerHTML = ''; return; }
  const last = S.review ? lastOf(g) : S.last;
  const an = S.review && S.review.ply > 0 && S.review.analysis ? S.review.analysis[S.review.ply] : null;
  const brd = g.board();
  const chk = g.in_check() ? findKing(brd, g.turn()) : null;
  const can = canInteract();
  let html = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const f = S.flip ? 7 - c : c, rk = S.flip ? r : 7 - r;
      const sq = FILES[f] + (rk + 1);
      const p = brd[7 - rk][f];
      let cls = 'sq ' + ((f + rk) % 2 === 0 ? 'dark' : 'light');
      if (last && (last.from === sq || last.to === sq)) cls += ' last';
      if (S.sel === sq) cls += ' sel';
      if (S.targets.includes(sq)) cls += ' target' + (p ? ' cap' : '');
      if (chk === sq) cls += ' check';
      let inner = '';
      if (c === 0) inner += `<i class="co rk">${rk + 1}</i>`;
      if (r === 7) inner += `<i class="co fl">${FILES[f]}</i>`;
      if (an && last && sq === last.to) inner += `<span class="sq-badge ${an.cls}" title="${esc(an.label)}. Best move: ${esc(an.best || '-')}" aria-label="${esc(an.label)}">${an.emoji}</span>`;
      if (p) inner += `<span class="pc ${p.color}"${can && ownsPiece(p) ? ' draggable="true"' : ''}>${GLYPH[p.type]}</span>`;
      html += `<div class="${cls}" data-sq="${sq}">${inner}</div>`;
    }
  }
  b.innerHTML = html;
}

function paintTargets() {
  $('board').querySelectorAll('.sq').forEach(el => {
    const sq = el.dataset.sq, t = S.targets.includes(sq);
    el.classList.toggle('sel', sq === S.sel);
    el.classList.toggle('target', t);
    el.classList.toggle('cap', t && !!S.game.get(sq));
  });
}

function bindBoard() {
  const b = $('board');
  b.addEventListener('click', e => { const s = e.target.closest('.sq'); if (s) onSquare(s.dataset.sq); });
  b.addEventListener('dragstart', e => {
    const s = e.target.closest('.sq');
    const p = s && S.game ? S.game.get(s.dataset.sq) : null;
    if (!s || !p || !canInteract() || !ownsPiece(p)) { e.preventDefault(); return; }
    S.sel = s.dataset.sq;
    S.targets = S.game.moves({square: S.sel, verbose: true}).map(m => m.to);
    e.dataTransfer.setData('text/plain', S.sel);
    e.dataTransfer.effectAllowed = 'move';
    paintTargets();
  });
  b.addEventListener('dragover', e => { if (S.sel) e.preventDefault(); });
  b.addEventListener('drop', e => {
    e.preventDefault();
    const s = e.target.closest('.sq');
    if (!s || !S.sel) return;
    const from = S.sel, to = s.dataset.sq;
    if (S.targets.includes(to)) tryMove(from, to); else { clearSel(); render(); }
  });
  b.addEventListener('dragend', () => { if (S.sel) { clearSel(); render(); } });
}

function playerInfo(color) {
  if (S.mode === 'local') return {name: color === 'w' ? 'White' : 'Black'};
  if (S.mode === 'ai') {
    if (color === S.color) return {name: S.profile ? S.profile.username : 'You'};
    if (S.botElo) return {name: S.botName, sub: String(S.botElo)};
    return {name: 'Computer', sub: ['', 'Easy', 'Medium', 'Hard'][S.aiLevel]};
  }
  const row = S.online.row, id = color === 'w' ? row.white_id : row.black_id;
  if (!id) return {name: 'Waiting for opponent…'};
  const p = PC[id];
  return {name: p ? p.username : 'Player', sub: p ? String(p.rating) : ''};
}

function captured(g) {
  const out = {w: [], b: []}, val = {w: 0, b: 0};
  g.history({verbose: true}).forEach(m => { if (m.captured) { out[m.color].push(m.captured); val[m.color] += PV[m.captured]; } });
  ['w', 'b'].forEach(c => out[c].sort((a, b) => PV[b] - PV[a]));
  return {out, diff: {w: val.w - val.b, b: val.b - val.w}};
}

function fillBar(el, color, g) {
  const info = playerInfo(color), cap = captured(g);
  const active = !S.over && !S.review && g.turn() === color && (S.mode !== 'online' || S.online.row.status === 'active');
  el.className = 'pbar' + (active ? ' turn' : '');
  const opp = color === 'w' ? 'b' : 'w';
  let clk = '';
  if (timedGame() && !S.review) {
    const ms = clockMs(color);
    clk = `<span class="clk${isRunning(color) ? ' run' : ''}${ms < 10000 ? ' low' : ''}" data-c="${color}">${fmtClock(ms)}</span>`;
  }
  el.innerHTML = `<span class="dot"></span><span class="pname">${esc(info.name)}${info.sub ? `<em>${esc(info.sub)}</em>` : ''}</span><span class="caps">${cap.out[color].map(t => `<span class="cp ${opp}">${GLYPH[t]}</span>`).join('')}</span><span class="adv">${cap.diff[color] > 0 ? '+' + cap.diff[color] : ''}</span>${clk}`;
}

function statusText() {
  const g = S.game;
  if (S.over) {
    const {result, reason} = S.over;
    if (result === '1/2-1/2') return `Draw by ${reason}.`;
    const wWon = result === '1-0';
    const winner = wWon ? 'White' : 'Black', loser = wWon ? 'Black' : 'White';
    let line;
    if (reason === 'resignation') line = `${loser} resigned.`;
    else if (reason === 'timeout') line = `${loser} ran out of time.`;
    else line = reason.charAt(0).toUpperCase() + reason.slice(1) + '.';
    if (S.mode === 'local') return `${line} ${winner} wins.`;
    return `${line} ${(wWon === (S.color === 'w')) ? 'You win.' : 'You lose.'}`;
  }
  if (S.mode === 'online' && S.online.row.status === 'waiting') return S.online.row.invited_id ? `Waiting for ${nameOf(S.online.row.invited_id)} to accept.` : 'Waiting for an opponent to join.';
  const chk = g.in_check() ? ' Check.' : '';
  if (S.mode === 'local') return `${g.turn() === 'w' ? 'White' : 'Black'} to move.${chk}`;
  if (S.mode === 'ai' && S.aiThinking) return 'Computer is thinking…';
  return (g.turn() === S.color ? 'Your move.' : 'Opponent’s move.') + chk;
}

function renderSide(vg) {
  const g = S.game;
  if (!g) return;
  fillBar($('pbar-top'), S.flip ? 'w' : 'b', vg);
  fillBar($('pbar-bot'), S.flip ? 'b' : 'w', vg);

  const h = g.history(), total = h.length;
  const st = $('status');
  if (S.review) {
    const an = S.review.analysis && S.review.analysis[S.review.ply];
    st.textContent = S.review.ply === 0 ? 'Overview: starting position.' : `Overview: after move ${S.review.ply} of ${total}.${an ? ' ' + an.label + '.' : ''}`;
  }
  else st.textContent = statusText();
  st.className = 'status' + (S.over ? ' done' : '');

  const inv = $('invite');
  if (S.mode === 'online' && S.online.row.status === 'waiting') {
    const row = S.online.row;
    inv.classList.remove('hidden');
    inv.innerHTML = `<div class="muted">${row.invited_id ? 'Challenge sent to ' + esc(nameOf(row.invited_id)) + '. You can also share this code.' : 'Share this code with a friend'}</div><div class="muted">${esc(tcLabel(row.time_control))}</div><div class="big">${esc(row.code)}</div><button class="btn sm" id="copy-code" type="button">Copy code</button>`;
    $('copy-code').onclick = () => { if (navigator.clipboard) navigator.clipboard.writeText(row.code).then(() => toast('Code copied.')); };
  } else inv.classList.add('hidden');

  const note = $('note');
  const botGame = S.mode === 'ai' && S.botElo > 0, onlineDone = S.mode === 'online' && S.over;
  note.classList.toggle('hidden', !(botGame || onlineDone));
  note.textContent = onlineDone ? 'Online games are deleted from the server once they finish. Use Overview to review this one before you leave.' : 'Unrated practice game against a bot.';

  const dp = ply => S.review ? ` data-ply="${ply}"${S.review.ply === ply ? ' class="cur"' : ''}` : '';
  let mv = '';
  for (let i = 0; i < total; i += 2) {
    const wp = i + 1, bp = i + 2;
    mv += `<li><span class="n">${i / 2 + 1}.</span><span${dp(wp)}>${esc(h[i])}${reviewLabelHtml(wp)}</span>${h[i + 1] ? `<span${dp(bp)}>${esc(h[i + 1])}${reviewLabelHtml(bp)}</span>` : '<span></span>'}</li>`;
  }
  const ml = $('moves');
  ml.innerHTML = mv;
  const cur = S.review && ml.querySelector('.cur');
  if (cur) {
    const cr = cur.getBoundingClientRect(), lr = ml.getBoundingClientRect();
    ml.scrollTop += (cr.top - lr.top) - (ml.clientHeight - cr.height) / 2;
  } else if (!S.review) ml.scrollTop = ml.scrollHeight;

  const c = $('controls');
  c.innerHTML = '';
  const add = (label, fn, cls) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = fn;
    c.appendChild(b); return b;
  };
  if (S.review) {
    const r = S.review;
    add('First', () => { stopAuto(); setPly(0); }).disabled = r.ply === 0;
    add('Back', () => { stopAuto(); setPly(r.ply - 1); }).disabled = r.ply === 0;
    add('Next', () => { stopAuto(); setPly(r.ply + 1); }).disabled = r.ply === total;
    add('Last', () => { stopAuto(); setPly(total); }).disabled = r.ply === total;
    add(r.timer ? 'Pause' : 'Auto-play', toggleAuto);
    add('Flip board', () => { S.flip = !S.flip; render(); });
    add('Exit overview', () => { endReview(); render(); }, 'primary');
    return;
  }
  add('Flip board', () => { S.flip = !S.flip; render(); });
  if (S.over && total) add('Overview', startReview, 'primary');
  if (S.mode === 'ai' || S.mode === 'local') {
    const u = add('Undo', undo);
    u.disabled = !total || S.aiThinking || S.tc > 0;
    if (S.tc > 0) u.title = 'Undo is off in timed games';
    add('New game', newGame);
  }
  if (S.mode === 'online' && S.online.row.status === 'active' && !S.over) {
    if (S.online.row.draw_offer === S.color) add('Draw offered', () => {}).disabled = true;
    else add('Offer draw', offerDraw);
    add('Resign', confirmResign, 'danger');
  }
  add('Back to lobby', leaveGame, 'ghost');
}

/* ═════════════ Move Review Analysis ═════════════ */
const REVIEW_DEPTH = 2;
/*
  Evaluation from the side-to-move's
  point of view.
*/
function reviewSideEvaluation(g) {
  return g.turn() === "w" ? evaluate(g) : -evaluate(g);
}
/*
  Small search used specifically for
  post-game move analysis.
  This is intentionally separate from
  the main AI search so reviewing a game
  doesn't change the computer opponent.
*/
function reviewSearch(g, depth) {
  if (depth <= 0) {
    return reviewSideEvaluation(g);
  }
  const moves = g.moves({
    verbose: true,
  });
  if (!moves.length) {
    return g.in_check() ? -100000 : 0;
  }
  orderMoves(moves);
  let best = -Infinity;
  for (const m of moves) {
    g.move({
      from: m.from,
      to: m.to,
      promotion: m.promotion || "q",
    });
    const score = -reviewSearch(g, depth - 1);
    g.undo();
    if (score > best) best = score;
  }
  return best;
}
/*
  Analyze one move.
  ply = 1 means White's first move.
  ply = 2 means Black's first move.
*/
function analyzeReviewMove(history, ply) {
  if (!history || !history[ply - 1]) return null;
  const before = rebuild(history.slice(0, ply - 1));
  const san = history[ply - 1];
  const legal = before.moves({
    verbose: true,
  });
  if (!legal.length) return null;
  let bestScore = -Infinity;
  let bestMove = null;
  /*
    Find the engine's best move.
  */
  for (const m of legal) {
    before.move({
      from: m.from,
      to: m.to,
      promotion: m.promotion || "q",
    });
    const score = -reviewSearch(before, REVIEW_DEPTH - 1);
    before.undo();
    if (score > bestScore) {
      bestScore = score;
      bestMove = m;
    }
  }
  /*
    Find the move the player actually made.
  */
  const actual = legal.find((m) => m.san === san);
  if (!actual) return null;
  before.move({
    from: actual.from,
    to: actual.to,
    promotion: actual.promotion || "q",
  });
  const actualScore = -reviewSearch(before, REVIEW_DEPTH - 1);
  const loss = Math.max(0, bestScore - actualScore);
  const wasMate = before.in_checkmate();
  /*
    Default.
  */
  let label = "Excellent";
  let cls = "review-excellent";
  let emoji = "🟢";
  /*
    Mate moves are treated as
    incredible.
  */
  if (wasMate) {
    label = "Incredible";
    cls = "review-incredible";
    emoji = "🤯";
  }
  /*
    Excellent.
  */
  else if (loss <= 12) {
    /*
      A strong capture can also be
      considered incredible.
    */
    if (
      actual.captured &&
      actualScore - reviewSideEvaluation(rebuild(history.slice(0, ply - 1))) >= 250
    ) {
      label = "Incredible";
      cls = "review-incredible";
      emoji = "🤯";
    } else {
      label = "Excellent";
      cls = "review-excellent";
      emoji = "🟢";
    }
  }
  /*
    Good.
  */
  else if (loss <= 35) {
    label = "Good";
    cls = "review-good";
    emoji = "👍";
  }
  /*
    Inaccuracy.
  */
  else if (loss <= 80) {
    label = "Inaccuracy";
    cls = "review-inaccuracy";
    emoji = "🟡";
  }
  /*
    Mistake.
  */
  else if (loss <= 180) {
    label = "Mistake";
    cls = "review-mistake";
    emoji = "⚠️";
  }
  /*
    Blunder.
  */
  else {
    label = "Blunder";
    cls = "review-blunder";
    emoji = "🔴";
  }
  return {
    label,
    cls,
    emoji,
    loss,
    best: bestMove ? bestMove.san : "",
    score: actualScore,
    bestScore,
  };
}
/*
  Analyze every move in the game.
  The analysis is performed one move at
  a time with small delays so the page
  remains responsive.
*/
function analyzeEntireReview() {
  if (!S.review || S.review.analyzing || !S.game) return;
  const history = S.game.history();
  S.review.analyzing = true;
  let ply = 1;
  function next() {
    if (!S.review) return;
    if (ply > history.length) {
      S.review.analyzing = false;
      render();
      return;
    }
    if (!S.review.analysis[ply]) {
      const currentPly = ply;
      setTimeout(() => {
        if (!S.review) return;
        try {
          S.review.analysis[currentPly] = analyzeReviewMove(history, currentPly);
        } catch (err) {
          console.error("Move analysis error:", err);
          S.review.analysis[currentPly] = null;
        }
        render();
        ply++;
        setTimeout(next, 10);
      }, 10);
    } else {
      ply++;
      setTimeout(next, 10);
    }
  }
  next();
}
/*
  HTML displayed next to each move.
*/
function reviewLabelHtml(ply) {
  if (!S.review) return "";
  const analysis = S.review.analysis && S.review.analysis[ply];
  if (S.review.analyzing && !analysis) {
    return `
      <span class="review-loading">
analyzing...
      </span>
    `;
  }
  if (!analysis) return "";
  return `
    <span
      class="move-review ${analysis.cls}"
      title="Best move: ${esc(analysis.best || "—")} • Lost ${Math.round(analysis.loss)} evaluation points"
    >
      <span class="review-emoji">
${analysis.emoji}
      </span>
      ${esc(analysis.label)}
    </span>
  `;
}
/* ═════════════ Post-game Overview ═════════════ */
function startReview() {
  if (!S.over || !S.game || !S.game.history().length) return;
  clearSel();
  S.review = {
    ply: S.game.history().length,
    timer: null,
    analysis: {},
    analyzing: false,
  };
  render();
  /*
    Start analyzing shortly after
    Overview opens.
  */
  setTimeout(analyzeEntireReview, 100);
}
function setPly(p) {
  if (!S.review) return;
  const total = S.game.history().length;
  S.review.ply = Math.max(0, Math.min(total, p));
  if (S.review.ply === total) stopAuto();
  render();
}
function stopAuto() {
  if (S.review && S.review.timer) {
    clearInterval(S.review.timer);
    S.review.timer = null;
  }
}
function toggleAuto() {
  if (!S.review) return;
  if (S.review.timer) {
    stopAuto();
    render();
    return;
  }
  const total = S.game.history().length;
  if (S.review.ply >= total) S.review.ply = 0;
  S.review.timer = setInterval(() => {
    if (S.review.ply >= S.game.history().length) {
      stopAuto();
      render();
      return;
    }
    setPly(S.review.ply + 1);
  }, 900);
  render();
}
function endReview() {
  if (S.review) {
    stopAuto();
    S.review = null;
  }
}

/* ═════════════ Decorative board on the sign-in page ═════════════ */
function miniBoard(el, fen) {
  let html = '', r = 0;
  fen.split(' ')[0].split('/').forEach(row => {
    let c = 0;
    const cell = ch => {
      const cls = (r + c) % 2 === 0 ? 'light' : 'dark';
      const piece = ch ? `<span class="pc ${ch === ch.toUpperCase() ? 'w' : 'b'}">${GLYPH[ch.toLowerCase()]}</span>` : '';
      html += `<div class="sq ${cls}" style="cursor:default">${piece}</div>`;
      c++;
    };
    for (const ch of row) { if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) cell(null); else cell(ch); }
    r++;
  });
  el.innerHTML = html;
}

/* ═════════════ Wiring ═════════════ */
function bindStatic() {
  renderBell();
  $('btn-bell').onclick = togglePanel;
  $('npanel').addEventListener('click', onPanelClick);
  document.addEventListener('mousedown', e => { if (!$('npanel').classList.contains('hidden') && !e.target.closest('#npanel, #btn-bell')) closePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
  renderSoundBtn();
  $('btn-sound').onclick = () => setSound(!SFX.on);
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (SFX.on) audio(); }, {once: true}));   // browsers only allow audio after a tap or key press
  $('tab-in').onclick = () => setAuthMode('in');
  $('tab-up').onclick = () => setAuthMode('up');
  $('auth-form').addEventListener('submit', submitAuth);
  $('guest').onclick = () => { S.guest = true; renderUserBox(); goLobby(); };
  $('brand').onclick = () => { if (S.mode) leaveGame(); else if (S.user || S.guest) goLobby(); };
  ['seg-level', 'seg-color'].forEach(id => initSeg($(id)));
  $('tc-ai').innerHTML = tcSeg('seg-ai-tc', 0);
  $('tc-local').innerHTML = tcSeg('seg-local-tc', 0);
  initSeg($('seg-ai-tc')); initSeg($('seg-local-tc'));
  $('start-ai').onclick = () => startAI(+$('seg-level').dataset.val, $('seg-color').dataset.val, +$('seg-ai-tc').dataset.val);
  $('start-local').onclick = () => startLocal(+$('seg-local-tc').dataset.val);
  setInterval(tick, 100);
  $('moves').addEventListener('click', e => {
    const t = e.target.closest('[data-ply]');
    if (t && S.review) { stopAuto(); setPly(+t.dataset.ply); }
  });
  document.addEventListener('keydown', e => {
    if (!S.review || $('modal-root').firstChild) return;
    const total = S.game.history().length;
    const keys = {ArrowLeft: S.review.ply - 1, ArrowRight: S.review.ply + 1, Home: 0, End: total};
    if (e.key in keys) { e.preventDefault(); stopAuto(); setPly(keys[e.key]); }
  });
  bindBoard();
  miniBoard($('mini'), 'r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 4');
}

(async function init() {
  bindStatic();
  const {data} = await sb.auth.getSession();
  if (data && data.session) await syncAccount(); else showView('auth');
  if (!S.user && !S.guest) showView('auth');   // session exists but isn't linked to an account
})();

})();
